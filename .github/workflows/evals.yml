name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Optional: an OpenAI-compatible gateway for the agent model. The
      # Cartwheel agent forwards it to the sandbox only when it is non-empty.
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
    steps:
      - name: Require the agent model variable
        run: |
          if [ -z "$CARTWHEEL_MODEL" ]; then
            echo "::error::Set the CARTWHEEL_MODEL repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Require the agent provider key
        # Prints only the secret's name, never its value.
        run: |
          uv run python -c '
          import os, sys
          from harbor_adapter.export import _provider_key
          key = _provider_key(os.environ["CARTWHEEL_MODEL"])
          if key and not os.environ.get(key):
              sys.exit(f"::error::Set the {key} repository secret for the agent model.")
          '

      - name: Install Harbor 0.23.0
        run: |
          uv tool install harbor==0.23.0
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # Five attempts per task, each in a fresh Docker container. Provider keys
      # reach Harbor through the job env: CartwheelAgent forwards the agent's
      # key, and Harbor resolves ${KEY} templates in each task's verifier env.
      # --yes answers Harbor's host-environment prompt, which would otherwise
      # block a non-interactive run once a task uses a judge.
      - name: Run the evaluation cases with Harbor
        run: |
          uv run harbor run \
            --path .harbor/tasks \
            --agent harbor_adapter.agent:CartwheelAgent \
            --model "$CARTWHEEL_MODEL" \
            --env docker \
            --n-attempts 5 \
            --n-concurrent 2 \
            --max-retries 0 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # The summary is the CI gate: it exits nonzero when a regression case
      # fails any run or a case is missing trials.
      - name: Summarize the evaluation and apply the CI gate
        if: always()
        run: uv run python scripts/summarize_harbor_job.py .harbor/jobs/hw6-evals --expected-attempts 5

      - name: Upload the Harbor job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
